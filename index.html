<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eatergo | Discover Food</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="logo">🍽️ Eatergo</div>
    <div class="search-bar">
      <input type="text" placeholder="Search restaurants, dishes or cuisines">
      <button>🔍</button>
    </div>
    <nav>
      <a href="login.html">Login</a> | 
      <a href="signup.html">Sign Up</a> | 
      <a href="cart.html">🛒 Cart</a>
    </nav>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <h1>Discover your next favourite meal.</h1>
    <p>Select location & explore categories</p>
  </section>

  <!-- Quick Categories -->
  <section class="categories">
    <h2>Quick Categories</h2>
    <div class="category-list">
      <button>🍕 Pizza</button>
      <button>🍔 Burgers</button>
      <button>🍜 Chinese</button>
      <button>🍛 Indian</button>
      <button>🍰 Desserts</button>
      <button>☕ Cafe</button>
      <button>🥗 Healthy</button>
      <button>🥘 Biryani</button>
    </div>
  </section>

  <!-- Restaurant Cards -->
  <section class="restaurants">
    <h2>Restaurants Near You</h2>
    <div class="restaurant-card">
      <img src="assets/images/restaurant1.jpg" alt="Restaurant">
      <h3>The Food Corner ⭐4.6</h3>
      <p>Indian • North Indian</p>
      <p>₹300 for two</p>
      <p>🛵 25–30 min • 2.1 km</p>
      <p>🔥 40% OFF</p>
    </div>
  </section>
</body>
</html>
